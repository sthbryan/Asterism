<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/mark.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Asterism</title>
    <script>
      (function () {
        try {
          var params = new URLSearchParams(location.search);
          var pref = params.get("theme") || localStorage.getItem("asterism:theme") || "dark";
          var glass =
            params.get("glass") === "1" || localStorage.getItem("asterism:transparency") === "1";
          var resolved =
            pref === "system"
              ? matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"
              : pref === "light"
                ? "light"
                : "dark";
          document.documentElement.dataset.theme = resolved;
          document.documentElement.dataset.themePref = pref;
          document.documentElement.dataset.transparency = glass ? "on" : "off";
          document.documentElement.style.colorScheme = resolved;
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
