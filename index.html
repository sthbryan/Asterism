<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/mark.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Asterism</title>
    <script>
      (() => {
        var params;
        var pref = "dark";
        var glass = false;
        var preset = "asterism";
        var resolved = "dark";
        try {
          params = new URLSearchParams(location.search);
          pref =
            params.get("theme") ||
            localStorage.getItem("asterism:theme") ||
            "dark";
          glass =
            params.get("glass") === "1" ||
            localStorage.getItem("asterism:transparency") === "1";
          resolved =
            pref === "system"
              ? matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"
              : pref === "light"
                ? "light"
                : "dark";
          preset =
            params.get("preset") ||
            localStorage.getItem("asterism:theme-preset") ||
            "asterism";
          if (!["asterism", "default", "fizza", "pulso"].includes(preset))
            preset = "asterism";
          document.documentElement.dataset.sephiroTheme =
            preset === "default" ? resolved : preset;
          document.documentElement.dataset.theme = resolved;
          document.documentElement.dataset.themePref = pref;
          document.documentElement.dataset.transparency = glass ? "on" : "off";
          document.documentElement.style.colorScheme = resolved;
        } catch {
          document.documentElement.dataset.theme = "dark";
          document.documentElement.dataset.sephiroTheme = "asterism";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
